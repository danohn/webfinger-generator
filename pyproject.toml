[project]
name = "webfinger-generator"
version = "0.1.0"
description = "Utilities for composing RFC 7033 (WebFinger) JRD responses."
readme = "README.md"
authors = [
    { name = "Codex", email = "codex@openai.com" },
]
requires-python = ">=3.12"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["webfinger", "rfc7033", "jrd", "discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/Codex/webfinger-generator"
Repository = "https://github.com/Codex/webfinger-generator"

[build-system]
requires = ["uv_build>=0.7.22,<0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
